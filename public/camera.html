<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Transmitter</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .overlay {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    }
    .badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #34d399;
    }
    .actions {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 16px;
      margin-bottom: 30px;
    }
    .action-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(15, 23, 42, 0.7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="badge" id="connStatus">Transmitting</div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <div class="actions">
    <!-- Flip Camera Button -->
    <button class="action-btn" onclick="toggleCameraFacing()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 2.21 1.005 4.21 2.618 5.567L4 20h6v-6l-2.45 2.45C6.012 15.228 5 13.728 5 12c0-3.866 3.134-7 7-7s7 3.134 7 7c0 1.728-1.012 3.228-2.55 4.45L14 14v6h6l-2.618-2.433C18.995 16.21 20 14.21 20 12z"/>
      </svg>
    </button>

    <!-- Torch Toggle Button -->
    <button class="action-btn" id="torchBtn" onclick="toggleTorch()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
    </button>
  </div>

  <script>
    const socket = io();
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let currentStream = null;
    let usingFrontCamera = false;
    let torchActive = false;
    let videoTrack = null;

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }

      const constraints = {
        video: {
          facingMode: usingFrontCamera ? 'user' : 'environment',
          width: { ideal: 640 },
          height: { ideal: 480 },
          frameRate: { ideal: 30, max: 30 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        videoTrack = currentStream.getVideoTracks()[0];
      } catch (err) {
        console.error('Camera Init Error:', err);
      }
    }

    function toggleCameraFacing() {
      usingFrontCamera = !usingFrontCamera;
      initCamera();
    }

    async function toggleTorch() {
      if (!videoTrack) return;
      try {
        const capabilities = videoTrack.getCapabilities();
        if (capabilities.torch) {
          torchActive = !torchActive;
          await videoTrack.applyConstraints({
            advanced: [{ torch: torchActive }]
          });
        } else {
          alert('Torch not supported on this lens');
        }
      } catch (e) {
        console.error('Torch error:', e);
      }
    }

    // High Speed Low Latency Stream Loop (~30 FPS)
    video.addEventListener('play', () => {
      canvas.width = 480;
      canvas.height = 360;

      setInterval(() => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const frame = canvas.toDataURL('image/jpeg', 0.45); // Optimized quality for fast transfer
          socket.emit('stream-data', { image: frame });
        }
      }, 33); // 33ms = 30 FPS smooth live stream
    });

    // Remote commands from dashboard
    socket.on('apply-camera-control', (command) => {
      if (command.action === 'flip') toggleCameraFacing();
      if (command.action === 'torch') toggleTorch();
    });

    // Speaker receive
    socket.on('speaker-play', async (audioChunk) => {
      const blob = new Blob([audioChunk], { type: 'audio/webm' });
      const audioUrl = URL.createObjectURL(blob);
      const audio = new Audio(audioUrl);
      try { await audio.play(); } catch (e) {}
    });

    initCamera();
  </script>
</body>
</html>
