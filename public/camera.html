<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Transmitter Node</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    
    .top-bar {
      position: relative; z-index: 10; padding: 14px 18px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    }

    select {
      background: #1e293b; color: #fff; border: 1px solid #475569;
      padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 14px; outline: none;
    }

    .status-badge {
      padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase; background: rgba(5, 150, 105, 0.25);
      border: 1px solid #059669; color: #34d399;
    }

    .bottom-bar {
      position: relative; z-index: 10; padding: 24px;
      display: flex; justify-content: center; gap: 20px;
      background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    }

    .btn-circle {
      width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25);
      background: rgba(15, 23, 42, 0.75); color: #fff; display: flex; align-items: center;
      justify-content: center; cursor: pointer; backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <select id="camSelect" onchange="switchAssignedNode()">
      <option value="cam-1">Camera 01 (Gate)</option>
      <option value="cam-2">Camera 02 (Hall)</option>
      <option value="cam-3">Camera 03 (Office)</option>
      <option value="cam-4">Camera 04 (Roof)</option>
      <option value="cam-5">Camera 05 (Yard)</option>
    </select>
    <div class="status-badge" id="txStatus">Transmitting</div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <div class="bottom-bar">
    <!-- Manual Flip on Phone -->
    <button class="btn-circle" onclick="toggleLens()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 2.21 1.005 4.21 2.618 5.567L4 20h6v-6l-2.45 2.45C6.012 15.228 5 13.728 5 12c0-3.866 3.134-7 7-7s7 3.134 7 7c0 1.728-1.012 3.228-2.55 4.45L14 14v6h6l-2.618-2.433C18.995 16.21 20 14.21 20 12z"/>
      </svg>
    </button>

    <!-- Manual Torch on Phone -->
    <button class="btn-circle" onclick="toggleTorch()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
    </button>
  </div>

  <script>
    const socket = io();
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const camSelect = document.getElementById('camSelect');

    let currentStream = null;
    let usingFrontCam = false;
    let torchState = false;
    let videoTrack = null;
    let activeCamId = localStorage.getItem('assigned_cam') || 'cam-1';

    camSelect.value = activeCamId;

    function switchAssignedNode() {
      activeCamId = camSelect.value;
      localStorage.setItem('assigned_cam', activeCamId);
      socket.emit('register-camera', activeCamId);
    }

    async function initStream() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }

      const constraints = {
        video: {
          facingMode: usingFrontCam ? 'user' : 'environment',
          width: { ideal: 640 },
          height: { ideal: 480 },
          frameRate: { ideal: 30 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        videoTrack = currentStream.getVideoTracks()[0];
        socket.emit('register-camera', activeCamId);
      } catch (err) {
        console.error('Camera startup failure:', err);
      }
    }

    function toggleLens() {
      usingFrontCam = !usingFrontCam;
      initStream();
    }

    async function toggleTorch() {
      if (!videoTrack) return;
      try {
        const capabilities = videoTrack.getCapabilities();
        if (capabilities.torch) {
          torchState = !torchState;
          await videoTrack.applyConstraints({
            advanced: [{ torch: torchState }]
          });
        }
      } catch (e) {
        console.error('Torch error:', e);
      }
    }

    // High performance 30 FPS Stream
    video.addEventListener('play', () => {
      canvas.width = 480;
      canvas.height = 360;

      setInterval(() => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const frame = canvas.toDataURL('image/jpeg', 0.45);
          socket.emit('stream-frame', { camId: activeCamId, image: frame });
        }
      }, 33);
    });

    // Remote Dashboard Control Commands
    socket.on('execute-command', (action) => {
      if (action === 'flip') toggleLens();
      if (action === 'torch') toggleTorch();
    });

    // Intercom Speaker Playback
    socket.on('speaker-output', async (audioChunk) => {
      const blob = new Blob([audioChunk], { type: 'audio/webm' });
      const audioUrl = URL.createObjectURL(blob);
      const audio = new Audio(audioUrl);
      try { await audio.play(); } catch (e) {}
    });

    initStream();
  </script>
</body>
</html>
